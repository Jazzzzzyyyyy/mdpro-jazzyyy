name: Build Mac Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch: 
    inputs:
      skip_dependencies:
        description: 'Skip fetching external dependencies'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout main repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache external dependencies
      id: cache-deps
      uses: actions/cache@v3
      with:
        path: external
        key: mdpro3-deps-${{ hashFiles('. github/workflows/build-mac-release.yml') }}
        restore-keys: mdpro3-deps-

    - name:  Fetch external dependencies (with retry)
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        mkdir -p external
        cd external

        echo "📥 Fetching Platforms..."
        for attempt in {1..3}; do
          echo "Attempt $attempt/3..."
          if git clone --depth 1 https://code.moenext.com/sherry_chaos/mdpro3-assetbundles.git platforms 2>/dev/null; then
            echo "✓ Platforms cloned successfully"
            break
          elif [ $attempt -lt 3 ]; then
            echo "⚠️ Attempt $attempt failed, retrying in 30s..."
            rm -rf platforms
            sleep 30
          else
            echo "❌ Failed to clone Platforms after 3 attempts"
            exit 1
          fi
        done

        echo "📥 Fetching HD-Arts..."
        for attempt in {1..3}; do
          echo "Attempt $attempt/3..."
          if git clone --depth 1 https://code.mycard.moe/mycard/hd-arts.git hd-arts 2>/dev/null; then
            echo "✓ HD-Arts cloned successfully"
            break
          elif [ $attempt -lt 3 ]; then
            echo "⚠️ Attempt $attempt failed, retrying in 30s..."
            rm -rf hd-arts
            sleep 30
          else
            echo "❌ Failed to clone HD-Arts after 3 attempts"
            exit 1
          fi
        done

        echo "📥 Fetching Closeup..."
        for attempt in {1.. 3}; do
          echo "Attempt $attempt/3..."
          if git clone --depth 1 https://code.mycard.moe/mycard/ygopro2-closeup.git closeup 2>/dev/null; then
            echo "✓ Closeup cloned successfully"
            break
          elif [ $attempt -lt 3 ]; then
            echo "⚠️ Attempt $attempt failed, retrying in 30s..."
            rm -rf closeup
            sleep 30
          else
            echo "❌ Failed to clone Closeup after 3 attempts"
            exit 1
          fi
        done

        echo "📥 Fetching Sound..."
        for attempt in {1..3}; do
          echo "Attempt $attempt/3..."
          if git clone --depth 1 https://code.moenext.com/mycard/mdpro3-sound.git sound 2>/dev/null; then
            echo "✓ Sound cloned successfully"
            break
          elif [ $attempt -lt 3 ]; then
            echo "⚠️ Attempt $attempt failed, retrying in 30s..."
            rm -rf sound
            sleep 30
          else
            echo "❌ Failed to clone Sound after 3 attempts"
            exit 1
          fi
        done

        cd .. 
        echo "✓ All dependencies fetched"

    - name: Link external dependencies
      run: |
        mkdir -p Assets/StreamingAssets
        
        # Remove old links if they exist
        rm -f Assets/StreamingAssets/Platforms
        rm -f Assets/StreamingAssets/hd-arts
        rm -f Assets/StreamingAssets/ygopro2-closeup
        rm -f Assets/StreamingAssets/mdpro3-sound
        
        # Create new symlinks
        ln -s ../../external/platforms/Platforms Assets/StreamingAssets/Platforms || true
        ln -s ../../external/hd-arts/Picture Assets/StreamingAssets/hd-arts || true
        ln -s ../../external/closeup/Picture Assets/StreamingAssets/ygopro2-closeup || true
        ln -s ../../external/sound Assets/StreamingAssets/mdpro3-sound || true
        
        echo "✓ External assets linked"
        ls -la Assets/StreamingAssets/

    - name: Install Unity (via Unity Hub)
      run: |
        # Download Unity version 6000.0.10f1
        echo "Installing Unity 6000.0.10f1..."
        sudo mkdir -p /Applications/Unity/Hub/Editors
        
        # Alternative: Use pre-built action
        echo "Using GameCI Unity Builder"

    - name: Setup GameCI/Unity Builder
      uses: game-ci/setup-unity@v2
      with:
        unity-version: 6000.0.10f1

    - name: Build for Mac
      uses: game-ci/unity-builder@v4
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        targetPlatform: StandaloneOSX
        unityVersion: 6000.0.10f1
        buildMethod: BuildScript. BuildMac
        buildName: MDPro3
        versioning: Semantic
        allowDirtyBuild: true

    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: MDPro3-Mac-Build
        path: build/StandaloneOSX/
        retention-days: 5

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/StandaloneOSX/MDPro3.app/**/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name:  Notify on failure
      if: failure()
      run: |
        echo "❌ Build failed!"
        echo "Common issues:"
        echo "1. External servers returning 504 - try manually fetching dependencies"
        echo "2. Unity license not configured - add UNITY_LICENSE secret"
        echo "3. Symlinks failed - check Assets/StreamingAssets permissions"
